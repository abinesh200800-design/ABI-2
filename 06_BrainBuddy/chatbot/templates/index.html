<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BrainBuddy</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#312e81,#020617);color:#f8fafc}
.shell{width:min(950px,100%);height:min(820px,94vh);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.2);border-radius:28px;background:rgba(15,23,42,.82);box-shadow:0 25px 80px rgba(0,0,0,.35);backdrop-filter:blur(18px)}
header{padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}
.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#818cf8,white);color:#0f172a;font-weight:900}
.badge{font-size:11px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.1)}
.hero{margin:0 18px 12px;padding:20px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.12)}
.hero h1{margin:0 0 6px;font-size:26px}
.hero p{margin:0;opacity:.72;font-size:14px}
.chat{flex:1;overflow:auto;padding:18px 24px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:13px 16px;border-radius:18px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.bot{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:5px}
.user{align-self:flex-end;background:linear-gradient(135deg,#818cf8,#312e81);border-bottom-right-radius:5px}
.typing{display:none;padding:0 24px 8px;font-size:12px;opacity:.6}
.composer{display:flex;gap:10px;padding:15px 18px;border-top:1px solid rgba(255,255,255,.12)}
textarea{flex:1;min-height:52px;max-height:130px;resize:none;border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px;background:rgba(255,255,255,.07);color:white;outline:none;font:inherit}
button{border:0;border-radius:16px;padding:0 22px;background:linear-gradient(135deg,#818cf8,#312e81);color:white;font-weight:800;cursor:pointer}
button:disabled{opacity:.5}
@media(max-width:650px){body{padding:0}.shell{height:100vh;border-radius:0}.msg{max-width:88%}.hero{margin:0 12px 8px}.chat{padding:14px}}
</style>
</head>
<body>
<main class="shell">
<header>
  <div class="brand"><div class="logo">B</div><span>BrainBuddy</span></div>
  <span class="badge">Gemini Study AI</span>
</header>
<section class="hero">
  <h1>BrainBuddy</h1>
  <p>Focused educational chatbot for Human Brain & Neuroscience. Study questions only.</p>
</section>
<section id="chat" class="chat">
  <div class="msg bot">Hi! I’m BrainBuddy. Ask me a study question about Human Brain & Neuroscience.</div>
</section>
<div id="typing" class="typing">Thinking...</div>
<form id="form" class="composer">
  <textarea id="message" placeholder="Ask a Human Brain & Neuroscience question..." rows="1"></textarea>
  <button id="send" type="submit">Send</button>
</form>
</main>
<script>
const form=document.getElementById("form");
const input=document.getElementById("message");
const chat=document.getElementById("chat");
const send=document.getElementById("send");
const typing=document.getElementById("typing");

function addMessage(text,role){
  const el=document.createElement("div");
  el.className="msg "+role;
  el.textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
}

form.addEventListener("submit",async(e)=>{
  e.preventDefault();
  const message=input.value.trim();
  if(!message||send.disabled)return;
  addMessage(message,"user");
  input.value="";
  send.disabled=true;
  typing.style.display="block";
  try{
    const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});
    const data=await res.json();
    if(!res.ok)throw new Error(data.error||"Request failed");
    addMessage(data.reply,"bot");
  }catch(err){
    addMessage(err.message||"Something went wrong. Please try again.","bot");
  }finally{
    typing.style.display="none";
    send.disabled=false;
    input.focus();
  }
});

input.addEventListener("keydown",(e)=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}
});
</script>
</body>
</html>
